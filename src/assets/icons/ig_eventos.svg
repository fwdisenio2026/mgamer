  <!-- Sparkle bursts top right -->
  <path d="M74 21 L78 17" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M80 25 L86 25" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M76 31 L82 34" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
