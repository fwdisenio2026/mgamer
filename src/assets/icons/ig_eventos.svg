<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="46" stroke="#9333ea" stroke-width="2.5" opacity="0.6" />
  <circle cx="50" cy="50" r="43" fill="#070211" stroke="#c084fc" stroke-width="3" />
  <circle cx="50" cy="50" r="40" stroke="#f472b6" stroke-width="1" opacity="0.5" />
  
  <!-- Cyber diagonal slash highlights -->
  <path d="M22 28 L35 15" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M72 78 L85 65" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Briefcase handle -->
  <path d="M42 32 L42 27 C42 25, 44 24, 46 24 L54 24 C56 24, 58 25, 58 27 L58 32" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />

  <!-- Briefcase body -->
