<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="46" stroke="#9333ea" stroke-width="2.5" opacity="0.6" />
  <circle cx="50" cy="50" r="43" fill="#070211" stroke="#c084fc" stroke-width="3" />
  <circle cx="50" cy="50" r="40" stroke="#f472b6" stroke-width="1" opacity="0.5" />
  
  <!-- Cyber diagonal slash highlights -->
  <path d="M22 28 L35 15" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M72 78 L85 65" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Calendar base -->
  <rect x="26" y="32" width="48" height="42" rx="7" fill="#1e0a3c" stroke="#d8b4fe" stroke-width="3" />
  <path d="M26 44 L74 44" stroke="#c084fc" stroke-width="2" />
  
  <!-- Calendar top rings/spirals -->
  <path d="M36 26 L36 34" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
  <path d="M50 26 L50 34" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
  <path d="M64 26 L64 34" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />

  <!-- Calendar grid days -->
  <rect x="32" y="50" width="6" height="5" rx="1.5" fill="#a855f7" />
  <rect x="42" y="50" width="6" height="5" rx="1.5" fill="#a855f7" />
  <rect x="52" y="50" width="6" height="5" rx="1.5" fill="#a855f7" />
  <rect x="62" y="50" width="6" height="5" rx="1.5" fill="#a855f7" />

  <rect x="32" y="60" width="6" height="5" rx="1.5" fill="#a855f7" />
  <!-- Highlighted check day -->
  <rect x="42" y="60" width="8" height="7" rx="2" fill="#ec4899" />
  <path d="M44 63.5 L46 65.5 L49 61.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="54" y="60" width="6" height="5" rx="1.5" fill="#a855f7" />
  <rect x="62" y="60" width="6" height="5" rx="1.5" fill="#a855f7" />

  <!-- Sparkle bursts top right -->
  <path d="M72 26 L76 22" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M78 29 L83 29" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M73 34 L78 37" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
</svg>
